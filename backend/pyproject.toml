[project]
name = "machiavillager"
version = "0.1.0"
description = "AI brain for Machiavillager, a scheming Minecraft companion NPC."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-ai-slim[openai]>=2.61.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.14",
    "pytest>=8.3",
    "ruff>=0.8",
    "jsonschema>=4.23",
    # Optional jsonschema dependency: without it "format": "date-time" is silently never checked.
    "rfc3339-validator>=0.1.4",
    "json-schema-for-humans>=1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The contract tests import the generators from scripts/, which is not a package.
pythonpath = ["scripts"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
