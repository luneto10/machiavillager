plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = 'machiavillager'
}

loom {
	// Keeps client-only code (rendering, keybinds, HUD) out of the common source set,
	// so the dedicated server can never load it by accident.
	splitEnvironmentSourceSets()

	mods {
		"machiavillager" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests for the pure-Java layers (domain, application). They never start Minecraft.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "com.tngtech.archunit:archunit-junit5:${project.archunit_version}"
	// Test-only: the bridge contract is checked against the shared JSON Schema, never at runtime.
	testImplementation "com.networknt:json-schema-validator:${project.json_schema_validator_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
