plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = 'machiavillager'
}

// One .env at the repo root feeds the backend and the run tasks. Read through providers so the
// configuration cache notices edits. Only MACHIAVILLAGER_* keys are passed on, and values are never printed.
def rootEnvFile = layout.projectDirectory.file('../.env')
def rootEnvText = providers.fileContents(rootEnvFile).asText.getOrElse('')
def runEnvironment = [:]
rootEnvText.eachLine { String rawLine ->
	def line = rawLine.trim()
	// Blank lines and comments carry no setting.
	if (line.isEmpty() || line.startsWith('#') || !line.contains('=')) {
		return
	}
	def (key, value) = line.split('=', 2).collect { it.trim() }
	if (key.startsWith('MACHIAVILLAGER_')) {
		// Quotes around a value are optional and stripped.
		runEnvironment[key] = value.replaceAll('^(["\'])(.*)\\1$', '$2')
	}
}

loom {
	// Keeps client-only code (rendering, keybinds, HUD) out of the common source set,
	// so the dedicated server can never load it by accident.
	splitEnvironmentSourceSets()

	mods {
		"machiavillager" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Every run task (runClient, runServer) gets the repo-root .env settings as environment variables.
	runs {
		configureEach { run ->
			runEnvironment.each { key, value -> run.environmentVariable(key, value) }
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The bridge checks every incoming message against the bundled schema, so the validator ships in the jar.
	// Loom nests it and its runtime libraries (Jar-in-Jar). slf4j comes from Minecraft, so it stays out.
	def jsonSchemaValidator = "com.networknt:json-schema-validator:${project.json_schema_validator_version}"
	implementation(jsonSchemaValidator) {
		exclude group: "org.slf4j"
	}
	// Include does not follow transitive dependencies, so the validator's runtime libraries are listed here.
	// Versions are the ones networknt 3.0.8 resolves to (see the runtimeClasspath tree); optional libraries stay out.
	[
		"com.ethlo.time:itu:1.14.0",
		"tools.jackson.core:jackson-core:3.2.1",
		"tools.jackson.core:jackson-databind:3.2.1",
		"com.fasterxml.jackson.core:jackson-annotations:2.22",
		"tools.jackson.dataformat:jackson-dataformat-yaml:3.2.1",
		"org.snakeyaml:snakeyaml-engine:3.0.1",
		jsonSchemaValidator,
	].each { include(it) }

	// Unit tests for the pure-Java layers (domain, application). They never start Minecraft.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "com.tngtech.archunit:archunit-junit5:${project.archunit_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	// The generated schema is copied from shared/ at build time, so the jar always carries the backend's file.
	from("../shared/protocol.schema.json") {
		into "machiavillager"
	}

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
